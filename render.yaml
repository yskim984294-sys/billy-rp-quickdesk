services:
  - type: web
    name: billy-rp-sync-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: billy-guide-sync-db
          property: connectionString
      - key: SYNC_SECRET
        generateValue: true
      - key: PGSSL
        value: disable
